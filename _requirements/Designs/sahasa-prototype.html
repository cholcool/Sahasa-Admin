<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahasa UI Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: same shell as the Figma file — red sidebar with expandable submenus + white top bar on desktop;
   red app bar + submenu chips + bottom nav + bottom-sheet modals on mobile (container query, so "จำลองมือถือ" works too). */
:root{
  --red:#ab0202;--red-dark:#7d0000;--red-soft:#fbeaea;--gold:#d9a520;--gold-soft:#fff4d6;--yellow:#ffe100;
  --page:#faf6f0;--card:#ffffff;--muted:#f3ece3;--border:#e8ddd0;--text:#2a1a16;--text2:#6e5f58;--on:#ffffff;
  --green:#1e8e4e;--green-soft:#e3f4ea;--blue:#1f6fb8;--blue-soft:#e3effa;--amber:#b26b00;--amber-soft:#fff0d4;--grey:#6e5f58;--grey-soft:#eee8e1;
  --sb:#ab0202;--sb-active:#7d0000;--scrim:rgba(42,26,22,.5);--shadow:0 12px 32px rgba(42,26,22,.18);--paper:#ffffff;--ink:#1d1d1d;
  --font:'IBM Plex Sans Thai',"Noto Sans Thai",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --red:#e0403a;--red-dark:#5a0707;--red-soft:#3a1716;--gold:#d9a520;--gold-soft:#372c12;--yellow:#ffe14d;
  --page:#17110f;--card:#221a17;--muted:#2c221e;--border:#3b2f2a;--text:#f3ebe6;--text2:#b8a89f;
  --green:#4cc27f;--green-soft:#15301f;--blue:#64a9ee;--blue-soft:#14283d;--amber:#e3a03a;--amber-soft:#3a2a10;--grey:#b8a89f;--grey-soft:#332a26;
  --sb:#6e0b0b;--sb-active:#4a0505;--scrim:rgba(0,0,0,.6);--shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#e0403a;--red-dark:#5a0707;--red-soft:#3a1716;--gold:#d9a520;--gold-soft:#372c12;--yellow:#ffe14d;
  --page:#17110f;--card:#221a17;--muted:#2c221e;--border:#3b2f2a;--text:#f3ebe6;--text2:#b8a89f;
  --green:#4cc27f;--green-soft:#15301f;--blue:#64a9ee;--blue-soft:#14283d;--amber:#e3a03a;--amber-soft:#3a2a10;--grey:#b8a89f;--grey-soft:#332a26;
  --sb:#6e0b0b;--sb-active:#4a0505;--scrim:rgba(0,0,0,.6);--shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--page);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:20px;font-weight:600}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
.muted{color:var(--text2)} .sm{font-size:12px} .num{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}

/* prototype bar (not part of the product UI) */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--muted);border-bottom:1px solid var(--border);font-size:13px}
.proto b{font-weight:600}
.proto .sp{flex:1}
.proto .pbtn{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:4px 12px}
.proto .pbtn.on{background:var(--text);color:var(--page);border-color:var(--text)}

/* device frame */
.device{container-type:inline-size;position:relative}
body.force .device{width:390px;max-width:100%;height:812px;margin:20px auto;border:10px solid var(--text);border-radius:36px;overflow:hidden;transform:translateZ(0)}
body.force .app{height:100%;overflow:auto;min-height:0}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

/* sidebar */
.sidebar{background:var(--sb);color:var(--on);position:sticky;top:0;height:100vh;overflow:auto;padding:24px 16px;display:flex;flex-direction:column;gap:24px}
.logo{border:1px solid rgba(255,255,255,.85);border-radius:8px;text-align:center;padding:6px 0 8px;line-height:1.2}
.logo b{display:block;font-size:30px;font-weight:700}
.logo span{font-size:16px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.ni{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:8px;border:0;background:none;color:var(--on);text-align:left;width:100%}
.ni:hover{background:rgba(255,255,255,.08)}
.ni.on{font-weight:600}
.ni.on.solo{background:var(--sb-active)}
.ni.on .ic:first-child{color:var(--yellow)}
.ni .lbl{flex:1}
.ni .tag{font-size:10px;background:rgba(255,255,255,.18);border-radius:8px;padding:0 6px}
.subs{display:flex;flex-direction:column;gap:2px;padding:2px 0 6px 32px}
.si{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:8px;border:0;background:none;color:var(--on);font-size:13px;text-align:left}
.si i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7;flex:none}
.si:hover{background:rgba(255,255,255,.08)}
.si.on{background:var(--sb-active);color:var(--yellow);font-weight:600}
.si.on i{opacity:1}
.sb-foot{margin-top:auto}

/* main */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:64px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:5}
.crumb{display:flex;align-items:center;gap:8px;font-size:20px;flex:1;min-width:0}
.crumb .m{color:var(--text2)} .crumb b{font-weight:600}
.who{display:flex;align-items:center;gap:14px}
.bell{position:relative;background:none;border:0;padding:2px}
.bell::after{content:"";position:absolute;top:1px;right:1px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--amber);display:grid;place-items:center;font-weight:600}
.appbar,.subtabs,.bnav{display:none}
.content{padding-block:28px 40px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;flex:1;min-width:0}

/* building blocks */
.page-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.page-head > div:first-child{flex:1;min-width:220px}
.page-head p{margin-top:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.pri{background:var(--red);color:#fff}
.btn.sec{background:var(--card);border-color:var(--border)}
.btn.gold{background:var(--gold);color:#2a1a16}
.btn.ghost{background:none;color:var(--red);padding:0 6px}
.btn.dang{background:var(--red-soft);color:var(--red)}
.btn:hover{filter:brightness(.97)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h2{flex:1}
.flat{background:var(--page);border-radius:10px;padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.stat-l{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:13px}
.stat-v{font-size:28px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--grey)}
.dot.green{background:var(--green)}.dot.blue{background:var(--blue)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}.dot.gold{background:var(--gold)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:12px;white-space:nowrap;background:var(--grey-soft);color:var(--grey)}
.badge.green{background:var(--green-soft);color:var(--green)}.badge.blue{background:var(--blue-soft);color:var(--blue)}.badge.amber{background:var(--amber-soft);color:var(--amber)}.badge.red{background:var(--red-soft);color:var(--red)}.badge.gold{background:var(--gold-soft);color:var(--amber)}
.badge.draft{background:none;border:1px dashed var(--amber);color:var(--amber)}
.banner{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 18px;font-weight:500;flex-wrap:wrap}
.banner .t{flex:1;min-width:200px}
.banner.gold{background:var(--gold-soft)}.banner.gold .ic{color:var(--amber)}
.banner.amber{background:var(--amber-soft)}.banner.amber .ic{color:var(--amber)}
.banner.red{background:var(--red-soft)}.banner.red .ic{color:var(--red)}
.banner.blue{background:var(--blue-soft)}.banner.blue .ic{color:var(--blue)}
.banner.green{background:var(--green-soft)}.banner.green .ic{color:var(--green)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.cols.side{grid-template-columns:minmax(0,1fr) 360px}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;gap:12px}
.kv > span:first-child{color:var(--text2);font-size:13px}
.kv > span:last-child{font-weight:500;text-align:right}
hr{border:0;border-top:1px solid var(--border);margin:0;width:100%}

/* form */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl{font-size:13px;color:var(--text2)}
.req{color:var(--red);font-weight:400}
.inp{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text2)}
.inp input,.inp select{border:0;background:none;outline:none;flex:1;min-width:0;height:100%;color:var(--text)}
.inp select{appearance:none;cursor:pointer}
.inp:focus-within{border-color:var(--red)}
.inp.dis{background:var(--muted)}
.inp em{font-style:normal;font-size:13px}
.inp.err{border-color:var(--red)}
textarea.ta{border:1px solid var(--border);border-radius:8px;background:var(--card);padding:10px 12px;min-height:76px;resize:vertical;width:100%}
.hint{font-size:12px;color:var(--text2)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fgrid .full{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:13px;white-space:nowrap}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.cb{width:18px;height:18px;accent-color:var(--red);margin:0;flex:none;cursor:pointer}
.radio{display:flex;align-items:center;gap:8px;cursor:pointer}
.radio input{width:18px;height:18px;accent-color:var(--red);margin:0}
.sw{width:36px;height:20px;border-radius:10px;border:0;background:var(--grey-soft);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--red)}
.sw.on::after{left:18px}
.drop{border:1.5px dashed var(--border);border-radius:12px;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--page)}
.drop .ic{color:var(--text2)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:72px;border-radius:8px;background:var(--muted);display:grid;place-items:center;color:var(--text2)}
.thumb.add{background:none;border:1.5px dashed var(--border)}

/* tabs */
.tabs{display:flex;gap:4px 22px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 2px;border-bottom:2px solid transparent;white-space:nowrap;color:var(--text2)}
.tab.on{color:var(--red);border-color:var(--red);font-weight:600}
.cnt{font-size:11px;background:var(--muted);border-radius:8px;padding:0 6px;margin-left:4px;color:var(--text2);font-weight:500}
.tab.on .cnt{background:var(--red-soft);color:var(--red)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse}
th{background:var(--muted);font-size:12px;color:var(--text2);font-weight:500;text-align:left;padding:11px 14px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--border);white-space:nowrap;vertical-align:middle}
td.wr{white-space:normal;min-width:200px}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
th.c,td.c{text-align:center}
tr.hl td{background:var(--amber-soft)}
tr.bad td{background:var(--red-soft)}
tr.tot td{font-weight:600;background:var(--page)}
.ord{color:var(--red);font-weight:600}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px}
.mlist{display:none;flex-direction:column;gap:10px}
.mcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.mcard.hl{background:var(--amber-soft)} .mcard.bad{background:var(--red-soft)}
.mtop{display:flex;align-items:flex-start;gap:10px}
.mtop .mt{flex:1;font-weight:600;min-width:0}
.mact{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.bulk{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border-radius:10px;padding:10px 14px;flex-wrap:wrap}
.bulk .sp{flex:1}
.bar{height:8px;border-radius:4px;background:var(--muted);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--red);border-radius:4px}
.bar.green > i{background:var(--green)}.bar.amber > i{background:var(--amber)}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .g{stroke:var(--border)}
.chart .lb{fill:var(--text2);font-size:11px;font-family:var(--font)}
.chart .b{fill:var(--red)}
.chart .b.last{fill:var(--gold)}

/* conn cards */
.ccard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ccard.add{border-style:dashed;align-items:center;justify-content:center;color:var(--red);font-weight:600;min-height:180px;background:none}
.plat{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

/* paper previews */
.paper{background:var(--paper);color:var(--ink);border:1px solid var(--border);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:22px;font-size:12px;display:flex;flex-direction:column;gap:10px}
.paper table td,.paper table th{border-top:1px dashed #bbb;background:none;color:var(--ink);padding:5px 6px;font-size:11px}
.paper .mono{font-size:11px}
.paper.inv{aspect-ratio:9/11;max-width:100%}
.ptitle{text-align:center;font-weight:700;font-size:14px}

/* role matrix */
.mx th:not(:first-child),.mx td:not(:first-child){text-align:center}
.mx tr.grp td{background:var(--page);font-weight:600;font-size:12px;color:var(--text2)}
.mx td small{display:block;color:var(--text2);font-size:11px}

/* notifications */
.nitem{display:flex;gap:12px;padding:14px 4px;border-top:1px solid var(--border)}
.nitem:first-child{border-top:0}
.nitem .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.nitem.unread .nt::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle}

/* map */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.mapcard .mh{display:flex;align-items:center;gap:12px}
.mapcard .mno{width:36px;height:36px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.subrow{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:var(--page);border:0;text-align:left;width:100%}
.subrow:hover{background:var(--muted)}
.subrow .sr1{display:flex;align-items:center;gap:8px;font-weight:600}
.subrow .sr1 .grow{color:var(--text)}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:11px;border:1px solid var(--border);border-radius:8px;padding:0 6px;color:var(--text2);background:var(--card)}

/* modal */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.mbox{background:var(--card);border-radius:16px;width:min(var(--w,560px),100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mhd{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--border)}
.mhd h2{flex:1;font-size:18px}
.xbtn{border:0;background:none;padding:4px;color:var(--text2)}
.mbd{padding:20px 24px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.mft{display:flex;gap:12px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--border);flex-wrap:wrap}
.handle{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--page);padding:10px 18px;border-radius:10px;z-index:60;display:flex;gap:8px;align-items:center;font-weight:500;box-shadow:var(--shadow)}
.drawer{position:fixed;inset:0;background:var(--scrim);z-index:55;display:flex}
.drawer .dbox{width:min(300px,85%);background:var(--sb);color:var(--on);height:100%;overflow:auto;padding:20px 14px;display:flex;flex-direction:column;gap:18px}

/* stats as links */
.stat-go{font:inherit;color:inherit;text-align:left;cursor:pointer}
.stat-go:hover{border-color:var(--red)}
.btn.full{width:100%}
.linkb{border:0;background:none;padding:0;font:inherit;color:var(--red);font-weight:600;cursor:pointer}
.alrt{display:flex;gap:12px;align-items:center;border:0;border-radius:10px;padding:12px 14px;text-align:left;width:100%;color:var(--text)}
.alrt.red{background:var(--red-soft)}.alrt.red .ic:first-child{color:var(--red)}
.alrt.amber{background:var(--amber-soft)}.alrt.amber .ic:first-child{color:var(--amber)}
.alrt.blue{background:var(--blue-soft)}.alrt.blue .ic:first-child{color:var(--blue)}
.alrt.gold{background:var(--gold-soft)}.alrt.gold .ic:first-child{color:var(--amber)}
.alrt:hover{filter:brightness(.98)}
/* stepper */
.steps{display:flex;align-items:flex-start;overflow-x:auto}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;flex:none;text-align:center;font-size:12px;color:var(--text2)}
.sc{width:28px;height:28px;border-radius:50%;background:var(--muted);display:grid;place-items:center;font-weight:600}
.step.cur{color:var(--text);font-weight:600}.step.cur .sc{background:var(--red);color:#fff}
.step.done .sc{background:var(--green);color:#fff}
.sline{flex:1;height:2px;background:var(--border);margin-top:13px;min-width:12px}
.sline.on{background:var(--green)}
/* qty + pick */
.qty{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card)}
.qty button{width:32px;height:32px;border:0;background:none;font-size:16px}
.qty b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.pick{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--card)}
.pick input{accent-color:var(--red);margin:3px 0 0;width:18px;height:18px;flex:none}
.pick:has(input:checked){border-color:var(--red);background:var(--red-soft)}
.dashed{border:1.5px dashed var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}

/* data view: table on desktop, cards on mobile.

function dv(cols,rows,o={}){
  const sel=o.sel;
  const th=`<tr>${sel?`<th style="width:40px"><input type="checkbox" class="cb cb-all" aria-label="เลือกทั้งหมด"></th>`:''}${cols.map(([l,a])=>`<th class="${a||''}">${l}</th>`).join('')}</tr>`;
  const trs=rows.map(r=>`<tr class="${r.cls||''}" ${r.t?`data-t="${r.t}"`:''}>${sel?`<td><input type="checkbox" class="cb cb-row" aria-label="เลือก" ${r.on?'checked':''}></td>`:''}${r.c.map((c,i)=>`<td class="${cols[i][1]||''}">${c}</td>`).join('')}</tr>`).join('');
  const m=o.m||{t:0,l:cols.map((_,i)=>i).slice(1)};
  const cards=rows.map(r=>`<div class="mcard ${r.cls||''}" ${r.t?`data-t="${r.t}"`:''}><div class="mtop">${sel?`<input type="checkbox" class="cb cb-row" aria-label="เลือก" ${r.on?'checked':''}>`:''}<div class="mt">${r.c[m.t]}</div>${m.b!=null?r.c[m.b]:''}</div>${m.s!=null?`<div class="muted sm">${r.c[m.s]}</div>`:''}${(m.l||[]).map(j=>kv(cols[j][0],r.c[j])).join('')}${m.a!=null&&r.c[m.a]?`<div class="mact">${r.c[m.a]}</div>`:''}</div>`).join('');
  return `<div class="tw mt"><table>${th}${trs}</table></div><div class="mlist">${cards}</div>`;
}

function salesChart(){const d=[38,42,35,51,47,39,44,58,62,49,45,53,60];const W=700,Hh=220,L=44,Bm=26,T=12,max=70,pw=W-L-12,ph=Hh-T-Bm,bw=pw/d.length;
 let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="ยอดขายรายวัน 1–13 พ.ย. หน่วยพันบาท">`;
 for(const v of [0,20,40,60]){const y=T+ph-(v/max)*ph;s+=`<line class="g" x1="${L}" x2="${W-12}" y1="${y}" y2="${y}"/><text class="lb" x="${L-8}" y="${y+4}" text-anchor="end">${v}k</text>`;}
 d.forEach((v,i)=>{const h=(v/max)*ph,x=L+i*bw+bw*.2,y=T+ph-h;s+=`<rect class="b ${i===d.length-1?'last':''}" x="${x}" y="${y}" width="${bw*.6}" height="${h}" rx="3"/><text class="lb" x="${x+bw*.3}" y="${Hh-8}" text-anchor="middle">${i+1}</text>`;});

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
let cur='map';
function parse(){const h=(location.hash||'').slice(1);return V[h]?h:'map';}
const VIEWMOD={'auth-session':'dashboard'};
const EXTRA={'order-detail':['list','ORD-000141'],'order-edit':['list','แก้ไข ORD-000141']};
const ROLEV={'dashboard-factory':[['map','dashboard','order','factory','users'],'โรงงาน'],'dashboard-acc':[['map','dashboard','order','acc','report','users'],'บัญชี']};
const navT=m=>m.subs?m.id+'-'+m.subs[0][0]:m.id;
function modOf(key){const id=VIEWMOD[key];return MODS.find(m=>id?m.id===id:(key===m.id||key.startsWith(m.id+'-')));}
function navHTML(mod,subKey,role){return MODS.filter(m=>!m.hideNav&&(!role||role[0].includes(m.id))).map(m=>{const act=m===mod;const open=act&&m.subs&&!m.hideSubs;
  return `<button type="button" class="ni ${act?'on':''} ${act&&!open?'solo':''}" data-go="${navT(m)}">${I(m.i,20)}<span class="lbl">${m.n}</span>${m.draft?'<span class="tag">ร่าง</span>':''}${m.subs&&!m.hideSubs?I(open?'cu':'cd',16):''}</button>${open?`<div class="subs">${m.subs.map(([k,l])=>`<button type="button" class="si ${subKey===k?'on':''}" data-go="${m.id}-${k}"><i></i>${l}</button>`).join('')}</div>`:''}`;}).join('');}
let RS={};
function render(){
  UID=0;
  const isAuth=cur.startsWith('auth-')&&!VIEWMOD[cur];
  $('#app').hidden=isAuth;$('#auth').hidden=!isAuth;
  const sc=document.body.classList.contains('force')?(isAuth?$('#auth'):$('#app')):window;
  if(isAuth){$('#auth').innerHTML=V[cur]();sc.scrollTo(0,0);return;}
  const mod=modOf(cur);const view=cur==='auth-session'?'dashboard-admin':cur;const role=ROLEV[view];
  let subKey=null,title=null;
  if(mod&&mod.subs&&!mod.hideSubs){const ex=EXTRA[cur];if(ex){subKey=ex[0];title=ex[1];}else{const s=mod.subs.find(x=>cur===mod.id+'-'+x[0]);if(s){subKey=s[0];title=s[1];}}}
  RS={mod,subKey,role};
  $('#sidebar').innerHTML=`<div class="logo"><b>สหัสา</b><span>Sahasa</span></div><nav class="nav">${navHTML(mod,subKey,role)}</nav><button type="button" class="ni sb-foot" data-go="auth-login">${I('logout',20)}<span class="lbl">ออกจากระบบ</span></button>`;
  $('#crumb').innerHTML=title?`<span class="m">${mod.n}</span>${I('cr',18)}<b>${title}</b>`:`<b>${mod?mod.n:'แผนผังเมนู'}</b>`;
  $('#abTitle').textContent=title||(mod?mod.n:'แผนผังเมนู');
  const showSub=!!(mod&&mod.subs&&!mod.hideSubs);
  $('#subtabs').innerHTML=showSub?mod.subs.map(([k,l])=>`<button type="button" class="chip ${subKey===k?'on':''}" data-go="${mod.id}-${k}">${l}</button>`).join(''):'';
  $('#subtabs').hidden=!showSub;
  const nm=role?role[1]:'Admin';$('#uname').textContent=nm;$('#av').textContent=nm.charAt(0);
  const bn=[['dashboard-admin','หน้าหลัก','home'],['order-list','Order','list'],['factory-queue','โรงงาน','factory'],['users-notif','แจ้งเตือน','bell'],['menu','เมนู','menu']];
  $('#bnav').innerHTML=bn.map(([k,l,i])=>{const on=k==='menu'?false:(k==='users-notif'?cur===k:(modOf(k)===mod&&cur!=='users-notif'));return `<button type="button" class="${on?'on':''}" ${k==='menu'?'data-menu':`data-go="${k}"`}>${I(i,22)}${l}</button>`;}).join('');
  $('#content').innerHTML=V[view]();
  const st=$('#subtabs .chip.on');if(st)st.scrollIntoView({block:'nearest',inline:'center'});
  sc.scrollTo(0,0);
  if(cur==='auth-session')openModal('m-timeout');
}
$('#menuBtn').innerHTML=I('menu',22);$('#abBell').innerHTML=I('bell',22);document.querySelector('.bell').innerHTML=I('bell',22);

/* modal + drawer + toast */
function openModal(id){const m=M[id];if(!m)return;closeModal();UID=500;
  const el=document.createElement('div');el.className='modal';el.id='modal';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',m.t);
  el.innerHTML=`<div class="mbox" style="--w:${m.w||560}px"><span class="handle"></span><div class="mhd"><h2>${m.t}</h2><button type="button" class="xbtn" data-close aria-label="ปิด">${I('x',22)}</button></div><div class="mbd">${m.b()}</div><div class="mft">${btn(m.c||'ยกเลิก','sec',null,m.cgo?`data-go="${m.cgo}"`:'data-close')}${btn(m.f,m.k||'pri',m.ic,`data-done="${m.toast||'บันทึกแล้ว'}"`)}</div></div>`;
  $('#device').appendChild(el);const f=el.querySelector('.mbd input,.mbd select,.mbd button,.mft .btn');if(f)f.focus({preventScroll:true});}
function closeModal(){const m=$('#modal');if(m)m.remove();const d=$('#drawer');if(d)d.remove();}
let tt;function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';e.setAttribute('role','status');$('#device').appendChild(e);}e.innerHTML=I('check',18)+'<span>'+t+'</span>';e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true;},2600);}
function openDrawer(){closeModal();const el=document.createElement('div');el.className='drawer';el.id='drawer';
  el.innerHTML=`<div class="dbox"><div class="logo"><b>สหัสา</b><span>Sahasa</span></div><nav class="nav">${navHTML(RS.mod,RS.subKey,RS.role)}</nav></div>`;
  $('#device').appendChild(el);}

document.addEventListener('click',e=>{
  const t=e.target;
  const go=t.closest('[data-go]');
  if(go){closeModal();goTo(go.dataset.go);if(go.dataset.toast)toast(go.dataset.toast);return;}
  const q=t.closest('[data-q]');if(q){const b=q.parentElement.querySelector('b');b.textContent=Math.max(0,(+b.textContent)+(+q.dataset.q));return;}
  const op=t.closest('[data-open]');if(op){openModal(op.dataset.open);return;}
  if(t.closest('[data-close]')||t.id==='modal'||t.id==='drawer'){closeModal();return;}
  const dn=t.closest('[data-done]');if(dn){closeModal();toast(dn.dataset.done);return;}
  const ts=t.closest('[data-toast]');if(ts){toast(ts.dataset.toast);return;}
  if(t.closest('[data-menu]')){openDrawer();return;}
  if(t.closest('#menuBtn')){openDrawer();return;}
  const sg=t.closest('[data-seg]');if(sg){sg.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===sg));return;}
  const mu=t.closest('[data-multi]');if(mu){mu.classList.toggle('on');return;}
  const s=t.closest('.sw');if(s){s.classList.toggle('on');s.setAttribute('aria-pressed',s.classList.contains('on'));return;}
  const tb=t.closest('.tab');if(tb){const bar=tb.parentElement;bar.querySelectorAll('.tab').forEach(x=>{x.classList.toggle('on',x===tb);x.setAttribute('aria-selected',x===tb);});
    const scope=tb.closest('[data-tabscope]')||tb.closest('.card');const k=tb.dataset.tab;
    if(scope)scope.querySelectorAll('[data-t]').forEach(r=>{r.hidden=!(k==='all'||r.dataset.t===k);});return;}
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.classList||!t.classList.contains('cb'))return;
  const scope=t.closest('[data-selscope]');if(!scope)return;
  if(t.classList.contains('cb-all'))scope.querySelectorAll('.cb-row').forEach(c=>{if(!c.closest('[hidden]'))c.checked=t.checked;});
  updBulk(scope);
});
function updBulk(scope){const vis=[...scope.querySelectorAll('.cb-row')].filter(c=>c.offsetParent!==null);const n=vis.filter(c=>c.checked).length;const b=scope.querySelector('.bulk');if(b){b.hidden=n===0;b.querySelector('.bulk-n').textContent=n;}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function goTo(k){closeModal();cur=V[k]?k:'map';try{if(location.hash!=='#'+cur)history.replaceState(null,'','#'+cur);}catch(_){}render();document.querySelectorAll('[data-selscope]').forEach(updBulk);}
window.addEventListener('hashchange',()=>{const k=parse();if(k!==cur)goTo(k);});

/* the scope helpers: card(...,'','" data-tabscope ...') injects attrs into the class string — normalise them */
const _card=card;
/* view toggle */
function setView(force){document.body.classList.toggle('force',force);$('#vw-mob').classList.toggle('on',force);$('#vw-real').classList.toggle('on',!force);try{localStorage.setItem('sahasa-view',force?'m':'r');}catch(_){}}
$('#vw-real').onclick=()=>setView(false);$('#vw-mob').onclick=()=>setView(true);
let pref='r';try{pref=localStorage.getItem('sahasa-view')||'r';}catch(_){}
setView(pref==='m');
cur=parse();render();
document.querySelectorAll('[data-selscope]').forEach(updBulk);
</script>
